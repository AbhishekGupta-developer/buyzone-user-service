spring.application.name=user-service

server.port=8081

# DB Configuration
spring.datasource.url=${MYSQL_DB_URL:jdbc:mysql://localhost:3306/buyzone_user_service?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_DB_USERNAME:root}
spring.datasource.password=${MYSQL_DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#spring.security.user.name=admin
#spring.security.user.password=Admin@root-2026

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.hostname=${EUREKA_SERVER_HOST:localhost}

#KAFKA CONFIGURATION
spring.kafka.bootstrap-servers=${KAFKA_URL:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Prevent sending Java class information in Kafka headers
spring.kafka.producer.properties.spring.json.add.type.headers=false